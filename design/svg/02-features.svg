<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520">
  <rect width="1440" height="520" fill="#F7F4EC"/>
  <text x="120" y="110" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#191D23">4 функции CRM4Retail</text>
  <text x="120" y="142" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#5B616B">Решение из ТЗ — строками прайса, а не карточками.</text>
  <!-- row 1 -->
  <rect x="120" y="184" width="12" height="12" rx="2" fill="#D92D20"/>
  <text x="148" y="196" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Анализ клиентов</text>
  <line x1="420" y1="190" x2="830" y2="190" stroke="#C9C2B2" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <text x="1320" y="196" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#5B616B">сегментация по частоте, чеку, давности</text>
  <line x1="120" y1="224" x2="1320" y2="224" stroke="#E5E0D5" stroke-width="1"/>
  <!-- row 2 -->
  <rect x="120" y="256" width="12" height="12" rx="2" fill="#D92D20"/>
  <text x="148" y="268" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Бонусная система</text>
  <line x1="420" y1="262" x2="830" y2="262" stroke="#C9C2B2" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <text x="1320" y="268" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#5B616B">начисление, уровни, сгорание</text>
  <line x1="120" y1="296" x2="1320" y2="296" stroke="#E5E0D5" stroke-width="1"/>
  <!-- row 3 -->
  <rect x="120" y="328" width="12" height="12" rx="2" fill="#D92D20"/>
  <text x="148" y="340" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Автоакции</text>
  <line x1="420" y1="334" x2="830" y2="334" stroke="#C9C2B2" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <text x="1320" y="340" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#5B616B">триггеры: «не был 30 дней», категория</text>
  <line x1="120" y1="368" x2="1320" y2="368" stroke="#E5E0D5" stroke-width="1"/>
  <!-- row 4 -->
  <rect x="120" y="400" width="12" height="12" rx="2" fill="#D92D20"/>
  <text x="148" y="412" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Подсказки на кассе</text>
  <line x1="460" y1="406" x2="830" y2="406" stroke="#C9C2B2" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <text x="1320" y="412" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#5B616B">кассир видит, что предложить</text>
  <line x1="120" y1="440" x2="1320" y2="440" stroke="#E5E0D5" stroke-width="1"/>
  <text x="120" y="480" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5B616B">* точные формулировки — по данным заказчика</text>
</svg>
