<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480">
  <rect width="1440" height="480" fill="#F7F4EC"/>
  <text x="120" y="100" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="-1" fill="#191D23">Как это увеличивает продажи</text>
  <text x="120" y="132" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#5B616B">Номера уместны: это последовательность.</text>
  <line x1="120" y1="190" x2="1320" y2="190" stroke="#E5E0D5" stroke-width="2"/>
  <!-- step 1 -->
  <circle cx="128" cy="190" r="5" fill="#D92D20"/>
  <text x="120" y="230" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#D92D20">01</text>
  <text x="120" y="262" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Анализ</text>
  <text x="120" y="290" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">CRM собирает чеки</text>
  <text x="120" y="312" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">и строит профиль клиента.</text>
  <!-- step 2 -->
  <circle cx="443" cy="190" r="5" fill="#D92D20"/>
  <text x="435" y="230" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#D92D20">02</text>
  <text x="435" y="262" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Сегменты</text>
  <text x="435" y="290" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">Делит базу: новички,</text>
  <text x="435" y="312" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">постоянные, «спящие».</text>
  <!-- step 3 -->
  <circle cx="758" cy="190" r="5" fill="#D92D20"/>
  <text x="750" y="230" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#D92D20">03</text>
  <text x="750" y="262" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Акции</text>
  <text x="750" y="290" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">Запускает персональные</text>
  <text x="750" y="312" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">предложения.</text>
  <!-- step 4 -->
  <circle cx="1073" cy="190" r="5" fill="#D92D20"/>
  <text x="1065" y="230" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#D92D20">04</text>
  <text x="1065" y="262" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#191D23">Касса</text>
  <text x="1065" y="290" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">Подсказывает продавцу</text>
  <text x="1065" y="312" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#5B616B">следующий шаг.</text>
  <text x="120" y="400" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5B616B">цикл повторяется с каждой покупкой • данные заказчика уточнят сроки</text>
</svg>
